<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#08080a;font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;color:#f5f0e6;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#08080a;padding:40px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#111114;border:1px solid #25252c;border-radius:16px;">
            <tr>
              <td style="padding:36px 32px 8px;font-family:Georgia,'Times New Roman',serif;font-size:22px;letter-spacing:0.28em;color:#f5f0e6;">
                ELVORA<span style="color:#c9a961;">.</span>
              </td>
            </tr>
            <tr>
              <td style="padding:8px 32px 0;font-size:15px;line-height:24px;color:#a9a397;">
                Use this code to sign in. It expires in one hour and can only be used once.
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:28px 32px;">
                <div style="display:inline-block;padding:16px 28px;border:1px solid #c9a961;border-radius:12px;font-family:'SFMono-Regular',Consolas,monospace;font-size:32px;letter-spacing:0.4em;color:#e2c88f;">
                  {{ .Token }}
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 36px;font-size:13px;line-height:20px;color:#a9a397;">
                If you didn't try to sign in to ELVORA, you can ignore this email — nobody can sign in without this code.
                ELVORA staff will never ask you for it.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
